---
# yamllint configuration for the NSG MES harness.
#
# We extend the default rule set, with two project-specific tweaks:
#
# 1. ``truthy`` on the ``on:`` key — GitHub Actions workflows use ``on:`` as
#    their trigger key, which yamllint flags by default because ``on`` could
#    be a boolean. Allow it explicitly.
#
# 2. ``line-length`` is loosened to 120 to match our ruff line-length budget.

extends: default

ignore: |
  .venv/
  node_modules/
  .orchestrator-state/
  worktrees/

rules:
  truthy:
    allowed-values: ["true", "false", "on", "off"]
  line-length:
    max: 120
    level: warning
  comments:
    min-spaces-from-content: 1
    require-starting-space: true
