---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy + architecture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy --strict

      - name: Architecture linter
        run: uv run python tools/linters/architecture.py

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

  security-audit:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --frozen

      - name: pip-audit
        # Audits every package installed in the synced venv (runtime + dev)
        # against PyPI's vulnerability database. Fails the build on any
        # known CVE. To suppress a known-but-unfixable CVE temporarily,
        # add `--ignore-vuln GHSA-xxxx-xxxx-xxxx` here AND open a
        # Harness-Fix ticket to track the upgrade window.
        run: uv run --with pip-audit pip-audit --strict

  license-check:
    name: License check (pip-licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --frozen

      - name: Reject copyleft licenses
        # MES is commercial software. Copyleft (AGPL, GPL, LGPL) deps
        # would contaminate the distribution. MIT/BSD/Apache/MPL are OK.
        # Customers in regulated industries (21 CFR, IATF) audit this.
        run: |
          uv run --with pip-licenses pip-licenses \
            --fail-on="AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;LGPL-3.0;LGPL-3.0-only;LGPL-3.0-or-later"

  build:
    name: Build (placeholder)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      # Docker images for the Django app and the React bundle will be built
      # here once the first MES Worker delivers the deploy story (see
      # tools/orchestrator/seed/initial_tickets.py, story 9). For now this
      # job exists so branch protection can require it without yet enforcing
      # any output.
      - name: Placeholder
        run: echo "Build placeholder; see seed ticket 9 for next steps."
