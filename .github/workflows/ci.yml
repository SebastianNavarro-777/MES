---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy + architecture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy --strict

      - name: Architecture linter
        run: uv run python tools/linters/architecture.py

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

  security-audit:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --frozen

      - name: pip-audit
        # Audits every package installed in the synced venv (runtime + dev)
        # against PyPI's vulnerability database. Fails the build on any
        # known CVE. To suppress a known-but-unfixable CVE temporarily,
        # add `--ignore-vuln GHSA-xxxx-xxxx-xxxx` here AND open a
        # Harness-Fix ticket to track the upgrade window.
        run: uv run --with pip-audit pip-audit --strict

  license-check:
    name: License check (pip-licenses)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync runtime-only environment
        # Runtime deps only (--no-dev): the license gate audits what we
        # DISTRIBUTE. Dev tools (ruff, mypy, pytest, yamllint, ...) are never
        # shipped to customers, so they are intentionally out of scope here.
        run: uv sync --no-dev --frozen

      - name: Reject copyleft licenses (runtime deps only)
        # MES is commercial, distributed software. Copyleft (AGPL/GPL/LGPL)
        # licenses in *distributed* (runtime) dependencies would contaminate
        # the product; MIT/BSD/Apache/MPL are fine. Customers in regulated
        # industries (21 CFR, IATF) audit this.
        #
        # This gate audits RUNTIME deps only — [project].dependencies plus
        # their transitive closure. Why runtime-only: dev-group tools are
        # never distributed, so their licenses cannot contaminate the product.
        # Auditing them produced false positives (e.g. yamllint is
        # GPL-3.0-or-later but is a purely local/CI linter declared in
        # [dependency-groups].dev). See NSG-46.
        #
        # Scope note: pip-audit (security-audit job) still covers runtime+dev
        # on purpose — CVEs matter in dev too. Only this license gate narrows.
        # The copyleft --fail-on list is UNCHANGED; only the audited package
        # set narrows. tools/linters/license_gate.py derives the runtime set
        # from `uv export --no-dev` and runs pip-licenses scoped to exactly
        # those packages.
        run: uv run --no-dev --with pip-licenses python tools/linters/license_gate.py

  build:
    name: Build (placeholder)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      # Docker images for the Django app and the React bundle will be built
      # here once the first MES Worker delivers the deploy story (see
      # tools/orchestrator/seed/initial_tickets.py, story 9). For now this
      # job exists so branch protection can require it without yet enforcing
      # any output.
      - name: Placeholder
        run: echo "Build placeholder; see seed ticket 9 for next steps."
