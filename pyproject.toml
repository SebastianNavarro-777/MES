[project]
name = "nsg-mes-harness"
version = "0.1.0"
description = "Agent-native harness for NSG Engineering's Manufacturing Execution System."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "NSG Engineering" },
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
# Modern uv pattern: dependency-groups are installed by default on
# `uv sync` and stay installed across `uv run` calls (unlike
# project.optional-dependencies which uv strips when not explicitly
# requested with --extra). This keeps ruff/mypy/pytest alive in the
# venv so the .claude/hooks/stop.sh pipeline doesn't go red after a
# `uv run` invocation.
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]
# yamllint is intentionally NOT in the synced venv: it is GPL-3.0-or-later,
# which the `license-check` CI job (pip-licenses) rejects for the commercial
# distribution. Like pip-audit/pip-licenses, it is a dev/CI CLI tool, so it
# is run ephemerally — `uv run --with yamllint yamllint .` (config in
# .yamllint.yml) — keeping copyleft out of the audited dependency surface.

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".orchestrator-state",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF",
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
# Workers extend `files` to include `packages` and `apps/<context>` once those
# directories contain real code. mypy errors when a configured path has no
# .py files, so we keep the default narrow during bootstrap.
files = ["tools"]
explicit_package_bases = true
mypy_path = "."
exclude = [
    "tools/orchestrator/launchd",
    "tools/orchestrator/systemd",
    "tools/orchestrator/seed",
]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
