# nginx config for the staging web tier.
# Serves the React SPA and reverse-proxies API + health traffic to the app.

upstream mes_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness for the web container's own healthcheck (does not touch the app).
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Health endpoint is proxied to Django so visiting <url>/healthz reflects
    # real backend + DB readiness (AC-3).
    location = /healthz {
        proxy_pass http://mes_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Future bounded-context APIs mount under /api/.
    location /api/ {
        proxy_pass http://mes_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
