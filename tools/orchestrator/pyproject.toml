[project]
name = "nsg-mes-orchestrator"
version = "0.1.0"
description = "Reactive orchestrator for NSG MES: ties Linear ↔ Claude Code ↔ GitHub via SQLite-backed triggers."
requires-python = ">=3.12"

# Runtime deps are declared in the repo-root pyproject.toml so a single
# `uv sync` from the repo root installs everything. This sub-pyproject
# exists for completeness and so launchd / systemd templates have a clear
# package boundary to point at.
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
